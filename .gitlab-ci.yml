default:
  image: registry.git-ce.rwth-aachen.de/af/images/jazzy_opencv4.12.0:develop
  # retry at least two times
  # retry: 2

cache:
  key: ${CI_COMMIT_REF_SLUG}

# variables:
  # DOCKER_DRIVER: overlay2

#############################
# Various snippets
#############################
# Defines the rule that the extending job only runs if tag is a version tag.
.tag_only: &tag_only
  rules:
    # Run this job when a tag in the format 'v1.2.3' is created
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# Defines version variable for tags.
.version: &version
  - export VERSION=${CI_COMMIT_TAG##v} # This removes 'v' from CI_COMMIT_TAG.


# skip complete pipeline if branch is experimental
# https://gitlab.com/gitlab-org/gitlab-foss/issues/26991
# therefore we add an "extends: .skip_experimental" to all jobs
.skip_experimental:
  except:
    variables:
      - $CI_COMMIT_REF_NAME =~ "experimental"

# Defines url and path variables for release related jobs.
.release_vars: &release_vars
  # urls:
  - export DOCS_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docs/${VERSION}/"
  # paths:
  - export DOC_PREFIX="docs"
  - export DEV_DOC_NAME="Entwicklerdokumentation.pdf"
  - export DEV_DOC_PATH="$DOC_PREFIX/$DEV_DOC_NAME"
  - export CPP_DOC_PATH="$DOC_PREFIX/cpp-docs/"
  - export CPP_DOC_TAR="cppdoc.tar.gz"

stages:
  - build
  - test
  - analysis
  - documentation
  - debian
  - release

###################################
# carolo cup ws
###################################
build:
  stage: build
  extends: .skip_experimental
  script:
    - sh ./ci_install.sh
    - colcon build --symlink-install
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - build/
      - install/


test:
  stage: test
  extends: .skip_experimental
  script:
    - sh ./ci_install.sh
    - colcon test --abort-on-error --executor sequential --packages-ignore psaf_configuration psaf_launch psaf_firststeps
    - 'colcon test-result --all |grep xml |cut -d":" -f1 | xargs .gitlab-ci/merge-test-results.py test-results.xml || true'
    - colcon test-result --verbose
  artifacts:
    name: "$CI_JOB_NAME"
    when: on_failure
    paths:
      - log/latest_test
      - log/latest_test-result


code:
  stage: analysis
  extends: .skip_experimental
  script:
    - cppcheck --suppressions-list=cppcheck_suppressions.txt ./src
  artifacts:
    name: "$CI_JOB_NAME"
    when: on_failure
    paths:
      - log/cppcheck_report.txt


variables:
  # Packages that should be ignored from build, test, and coverage
  PACKAGES_TO_IGNORE: "psaf_configuration psaf_launch psaf_firststeps"
  # CMake arguments for enabling Gcov/Lcov profiling
  CXX_FLAGS_ARG: -DCMAKE_CXX_FLAGS='-fprofile-arcs -ftest-coverage'
  C_FLAGS_ARG: -DCMAKE_C_FLAGS='-fprofile-arcs -ftest-coverage -DCOVERAGE_RUN=1'

coverage:
  stage: analysis
  script:
    # --- 1. Build (Single build, enabling coverage probes) ---
    - echo "--- 1. Building all packages with Coverage Flags ---"
    - colcon build --symlink-install --packages-ignore $PACKAGES_TO_IGNORE --cmake-clean-cache || exit 1
    # Build with profiling flags
    - colcon build --symlink-install --packages-ignore $PACKAGES_TO_IGNORE --cmake-args "$CXX_FLAGS_ARG" "$C_FLAGS_ARG" || exit 1

    # --- 2. Initialize LCOV Counters ---
    - echo "--- 2. Initializing LCOV Counters ---"
    # Use --ignore-errors mismatch to bypass GTest linking errors
    - colcon lcov-result --initial --packages-ignore $PACKAGES_TO_IGNORE --lcov-args --ignore-errors mismatch || exit 1

    # --- 3. Run Tests (Generates raw .gcda data) ---
    - echo "--- 3. Running Tests (on all packages) ---"
    - colcon test --packages-ignore $PACKAGES_TO_IGNORE --executor sequential || exit 1

    # --- 4. Generate Raw LCOV Report (Aggregates all packages) ---
    - echo "--- 4. Generating Raw LCOV Report ---"
    - colcon lcov-result --packages-ignore $PACKAGES_TO_IGNORE --verbose || exit 1
    
    # --- 5. Clean and Finalize Report (Manual LCOV --remove) ---
    - echo "--- 5. Cleaning and Finalizing Report (Removing Noise) ---"
    
    # Define file paths
    - RAW_INFO_FILE="$CI_PROJECT_DIR/lcov/total_coverage.info"
    - FINAL_INFO_FILE="$CI_PROJECT_DIR/lcov/project_final.info"
    
    # CRITICAL FIX: Use lcov --remove to exclude system and test files 
    - |
      echo "Running lcov --remove..."
      lcov --remove "$RAW_INFO_FILE" \
        "/opt/ros/*" \
        "/usr/*" \
        "*/test/*" \
        "*/msg/detail/*" \
        "*/src/*_node.cpp" \
        -o $FINAL_INFO_FILE \
        || { echo "ERROR: LCOV remove failed! Check file paths."; exit 1; }

    # --- 6. Generate HTML and Summary ---
    - echo "--- 6. Generating HTML Report ---"
    - mkdir -p $CI_PROJECT_DIR/lcov/html
    - genhtml $FINAL_INFO_FILE -o $CI_PROJECT_DIR/lcov/html || exit 1
    - lcov --summary $FINAL_INFO_FILE
  
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - lcov
  
  # Regex to capture the percentage from lcov --summary output
  coverage: '/^\s*lines.*:\s*(\d+\.\d+)%/'

documentation_doxygen:
  stage: documentation
  extends: .skip_experimental
  script:
    - doxygen Doxyfile
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - docs/cpp-docs


documentation_asciidoc:
  stage: documentation
  image: asciidoctor/docker-asciidoctor:latest
  extends: .skip_experimental
  script:
    - asciidoctor --base-dir=docs/Entwicklerdokumentation --destination-dir=.. docs/Entwicklerdokumentation/Entwicklerdokumentation.adoc
    - asciidoctor-pdf --base-dir=docs/Entwicklerdokumentation --destination-dir=.. docs/Entwicklerdokumentation/Entwicklerdokumentation.adoc
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - docs


# Upload the documentation (README) to gitlabs release.
upload:
  stage: release
  image: curlimages/curl:latest
  <<: *tag_only
  script:
    - *version
    - *release_vars
    # Create archive of cpp docs:
    - echo "Create archive of cpp export"
    - cd $CPP_DOC_PATH && tar -czvf ../../$CPP_DOC_TAR * && cd ../..
    # Upload files to registry:
    - echo "Upload ${DEV_DOC_PATH} to ${DOCS_REGISTRY_URL}"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${DEV_DOC_PATH} ${DOCS_REGISTRY_URL}
    - echo "Upload ${CPP_DOC_TAR} to ${DOCS_REGISTRY_URL}"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${CPP_DOC_TAR} ${DOCS_REGISTRY_URL}
  dependencies:
    - documentation_doxygen
    - documentation_asciidoc


# This will create a release within gitlab.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  <<: *tag_only
  script:
    - *version
    - *release_vars
    # Use release-cli to create a release and link all information
    - echo 'Creating release'
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \
        --assets-link \
        "{\"name\":\"${DEV_DOC_NAME}\",\"url\":\"${DOCS_REGISTRY_URL}${DEV_DOC_NAME}\"}" \
        --assets-link \
        "{\"name\":\"${CPP_DOC_TAR}\",\"url\":\"${DOCS_REGISTRY_URL}${CPP_DOC_TAR}\"}" \
